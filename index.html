<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tadbeer Alsultan — App Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
.leaflet-control-attribution{font-size:9px !important;}
</style>
<style>
:root{
  --surface:#F8F4EA;
  --surface-deep:#EFE9D8;
  --card:#FFFFFF;
  --ink:#182427;
  --ink-muted:#59676A;
  --ink-faint:#93A0A2;
  --primary:#0B7D8C;
  --primary-dark:#075B66;
  --primary-tint:#DEF1F3;
  --accent:#D9A441;
  --accent-ink:#5C4413;
  --accent-tint:#FBF0DA;
  --rust:#B85C38;
  --rust-tint:#F7E8E0;
  --blue:#3E7CB1;
  --blue-tint:#E3EDF5;
  --sage:#4C7A52;
  --sage-tint:#E7F0E5;
  --line:#E6DFCC;
  --line-soft:#EFEADC;
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:10px;
  --font-display:'Fraunces', serif;
  --font-body:'Plus Jakarta Sans', sans-serif;
  --font-ar:'Cairo', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--surface);
  background-image:
    radial-gradient(circle at 18% 8%, rgba(11,125,140,0.07), transparent 40%),
    radial-gradient(circle at 85% 92%, rgba(217,164,65,0.08), transparent 45%);
  font-family:var(--font-body);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- Tactile feedback & accessibility ---------- */
.btn-primary, .btn-ghost, .chip, .inq-type, .service-tile, .svc-row,
.order-card[onclick], .nav-btn, .icon-btn, .filter-chip, .stepper button,
.worker-pick:not(.unavailable), .menu-row[onclick], .rebook-strip, .back-btn,
.role-switch button, .lang-toggle button{
  transition: transform .12s ease, opacity .12s ease, background-color .15s ease, border-color .15s ease;
}
.btn-primary:active, .btn-ghost:active, .chip:active, .inq-type:active,
.service-tile:active, .svc-row:active, .order-card[onclick]:active,
.icon-btn:active, .filter-chip:active, .stepper button:not(:disabled):active,
.worker-pick:not(.unavailable):active, .rebook-strip:active, .back-btn:active{
  transform: scale(0.96);
}
.nav-btn:active{ opacity:0.6; }
a, button, select, input, textarea, [onclick], [tabindex]{
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible, a:focus-visible, select:focus-visible,
input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* ---------- Demo toolbar ---------- */
.demo-toolbar{
  width:100%;
  max-width:900px;
  padding:20px 20px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  text-align:center;
}
.demo-brand{
  font-family:var(--font-display);
  font-weight:600;
  font-size:15px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--primary-dark);
}
.demo-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:26px;
  color:var(--ink);
  margin:0;
}
.demo-sub{
  font-size:13.5px;
  color:var(--ink-muted);
  max-width:480px;
  line-height:1.55;
  margin:0 0 4px;
}
.controls-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}
.role-switch{
  display:flex;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px;
  gap:2px;
  box-shadow:0 1px 2px rgba(27,36,31,0.04);
}
.role-switch button{
  border:none;
  background:transparent;
  font-family:var(--font-body);
  font-weight:600;
  font-size:13px;
  padding:8px 16px;
  border-radius:999px;
  cursor:pointer;
  color:var(--ink-muted);
  display:flex;
  align-items:center;
  gap:6px;
  transition:background .18s ease, color .18s ease;
}
.role-switch button.active{
  background:var(--primary);
  color:#fff;
}
.lang-toggle{
  display:flex;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px;
  gap:2px;
  box-shadow:0 1px 2px rgba(27,36,31,0.04);
}
.lang-toggle button{
  border:none;
  background:transparent;
  font-weight:700;
  font-size:12.5px;
  padding:8px 14px;
  border-radius:999px;
  cursor:pointer;
  color:var(--ink-muted);
  transition:background .18s ease, color .18s ease;
}
.lang-toggle button.active{
  background:var(--accent);
  color:var(--accent-ink);
}
.demo-hint{
  font-size:11.5px;
  color:var(--ink-faint);
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:2px;
}

/* ---------- Stage / phone frame ---------- */
.stage{
  flex:1;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:22px 16px 56px;
}
.phone-frame{
  width:380px;
  height:800px;
  background:#0C0F0D;
  border-radius:46px;
  padding:14px;
  box-shadow:0 30px 60px -20px rgba(20,30,25,0.35), 0 2px 8px rgba(20,30,25,0.12);
  position:relative;
  flex-shrink:0;
}
.phone-screen{
  width:100%;
  height:100%;
  background:var(--surface);
  border-radius:32px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}
.notch{
  position:absolute;
  top:0; left:50%;
  transform:translateX(-50%);
  width:120px; height:26px;
  background:#0C0F0D;
  border-bottom-left-radius:16px;
  border-bottom-right-radius:16px;
  z-index:50;
}
.status-bar{
  height:46px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 26px;
  font-size:13px;
  font-weight:700;
  color:var(--ink);
  background:var(--surface);
}
.status-bar .sb-icons{display:flex; gap:5px; align-items:center; font-size:15px;}

.app-viewport{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.app-viewport::-webkit-scrollbar{display:none;}

.screen{
  min-height:100%;
  padding-bottom:14px;
}
.screen.push{animation:slideInRight .32s cubic-bezier(.32,.72,.35,1);}
.screen.pop{animation:slideInLeft .32s cubic-bezier(.32,.72,.35,1);}
.screen.fade{animation:screenFade .22s ease;}
@keyframes slideInRight{
  from{opacity:0; transform:translateX(28px);}
  to{opacity:1; transform:translateX(0);}
}
@keyframes slideInLeft{
  from{opacity:0; transform:translateX(-28px);}
  to{opacity:1; transform:translateX(0);}
}
@keyframes screenFade{
  from{opacity:0; transform:translateY(6px);}
  to{opacity:1; transform:translateY(0);}
}

.bottom-nav{
  flex-shrink:0;
  display:flex;
  position:relative;
  background:rgba(255,255,255,0.82);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid var(--line);
  padding:10px 6px calc(14px + env(safe-area-inset-bottom,0px));
}
.nav-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  border:none;
  background:transparent;
  cursor:pointer;
  font-family:var(--font-body);
  color:var(--ink-faint);
  font-size:10.5px;
  font-weight:600;
  padding:4px 2px;
  position:relative;
}
.nav-icon-wrap{position:relative; display:inline-flex;}
.nav-badge{
  position:absolute; top:-4px; right:-7px;
  min-width:14px; height:14px; padding:0 3px;
  background:var(--rust); color:#fff;
  border-radius:999px; font-size:9px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
  line-height:1; border:1.5px solid var(--card);
}
.nav-btn i{font-size:21px;}
.nav-btn.active{color:var(--primary);}

/* ---------- Common UI bits ---------- */
.topbar{
  padding:18px 20px 12px;
  display:flex;
  align-items:center;
  gap:12px;
}
.topbar h1{
  font-family:var(--font-display);
  font-size:20px;
  font-weight:600;
  margin:0;
  color:var(--ink);
}
.back-btn{
  width:38px; height:38px;
  border-radius:50%;
  background:var(--card);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  color:var(--ink);
  font-size:22px;
  font-weight:700;
  line-height:1;
  flex-shrink:0;
}
.px{padding-left:20px; padding-right:20px;}

.search-bar{
  margin:0 20px 18px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--ink-faint);
  font-size:13.5px;
}
.search-bar i{font-size:16px; flex-shrink:0;}
.search-bar input{
  border:none; background:none; padding:0; flex:1;
  font-family:var(--font-body); font-size:13.5px; color:var(--ink);
  min-width:0;
}
.search-bar input::placeholder{color:var(--ink-faint);}
.search-bar input:focus{outline:none;}
.search-clear{
  border:none; background:var(--surface-deep); color:var(--ink-muted);
  width:20px; height:20px; border-radius:50%; font-size:15px; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0;
}

.rebook-strip{
  margin:0 20px 16px; background:var(--accent-tint); border:1px solid #EFDBAA;
  border-radius:var(--radius-md); padding:11px 14px;
  display:flex; align-items:center; gap:12px; cursor:pointer;
}
.rebook-strip .svc-info b{color:var(--accent-ink);}

.section-label{
  font-size:11.5px;
  font-weight:700;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink-faint);
  margin:22px 20px 10px;
}

.service-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:0 20px;
}
.service-tile{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:14px 8px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
  text-align:center;
}
.service-tile .tile-icon{
  width:42px; height:42px;
  border-radius:12px;
  background:var(--primary-tint);
  color:var(--primary-dark);
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
}
.service-tile span{font-size:11.5px; font-weight:600; line-height:1.3; color:var(--ink);}

.promo-card{
  margin:4px 20px 6px;
  background:linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-radius:var(--radius-lg);
  padding:20px;
  color:#fff;
  position:relative;
  overflow:hidden;
}
.promo-card::after{
  content:"";
  position:absolute; right:-30px; top:-30px;
  width:120px; height:120px;
  border-radius:50%;
  background:rgba(255,255,255,0.08);
}
.promo-eyebrow{font-size:10.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; opacity:0.75;}
.promo-title{font-family:var(--font-display); font-size:19px; font-weight:600; margin:4px 0 3px;}
.promo-sub{font-size:12.5px; opacity:0.88;}

.card-list{padding:0 20px; display:flex; flex-direction:column; gap:12px;}
.svc-row{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:13px 14px;
  display:flex; align-items:center; gap:12px;
  cursor:pointer;
}
.svc-row .tile-icon{width:40px; height:40px; border-radius:11px; background:var(--accent-tint); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.svc-info{flex:1; min-width:0;}
.svc-info b{display:block; font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:2px;}
.svc-info span{font-size:11.5px; color:var(--ink-muted);}
.svc-row .chev{color:var(--ink-faint); font-size:16px;}

/* Booking detail */
.hero-block{
  margin:0 20px 4px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:20px;
  text-align:center;
}
.hero-block.with-photo{padding:0; overflow:hidden;}
.hero-photo{height:140px; background-size:cover; background-position:center; position:relative;}
.hero-block.with-photo .hero-body{padding:18px 20px 20px;}
.hero-block h2{font-family:var(--font-display); font-size:19px; margin:0 0 6px; font-weight:600;}
.hero-block p{font-size:12.5px; color:var(--ink-muted); line-height:1.5; margin:0;}

.field-group{padding:16px 20px 4px;}
.field-label{font-size:12px; font-weight:700; color:var(--ink); margin-bottom:8px; display:block;}
.field-label .req{color:var(--rust);}
.input-error{border-color:var(--rust) !important; background:var(--rust-tint) !important;}
.field-error{color:var(--rust); font-size:11px; margin:0 0 12px; display:flex; align-items:center; gap:4px; font-weight:600;}
.select-wrap{position:relative; margin-bottom:14px;}
select, .fake-input, textarea, input[type="text"], input[type="date"]{
  width:100%;
  font-family:var(--font-body);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  font-size:13.5px;
  color:var(--ink);
  appearance:none;
}
.select-wrap i{position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none;}
textarea{resize:none; min-height:66px; font-family:var(--font-body);}
.chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chip{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:999px;
  padding:9px 14px;
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-muted);
  cursor:pointer;
}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}

.stepper{display:flex; align-items:center; gap:16px; margin-bottom:14px;}
.stepper button{
  width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--card);
  font-size:17px; font-weight:700; color:var(--primary-dark); cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.stepper button:disabled{opacity:0.35; cursor:default;}
.stepper .count{font-family:var(--font-display); font-size:17px; font-weight:600; min-width:20px; text-align:center;}
.stepper .stepper-label{font-size:12.5px; color:var(--ink-muted); margin-left:2px;}

.map-box{
  height:160px; border-radius:var(--radius-md); overflow:hidden;
  border:1px solid var(--line); margin-bottom:6px; background:var(--surface-deep);
}
.map-box.view{height:150px; margin:0 20px 12px;}

.ops-map-wrap{margin:0 20px 20px;}
.map-box.ops-map{height:190px; margin:0 0 10px; box-shadow:0 6px 20px -8px rgba(20,30,25,0.25);}
.ops-legend{display:flex; gap:14px; flex-wrap:wrap;}
.ops-legend span{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-muted); font-weight:600;}
.dot-legend{width:8px; height:8px; border-radius:50%; display:inline-block;}
.map-hint{font-size:11px; color:var(--ink-faint); margin:0 0 14px; display:flex; align-items:center; gap:5px;}
.map-link{
  display:flex; align-items:center; justify-content:center; gap:7px;
  text-decoration:none; margin:0 20px 16px;
}

.rate-block{
  margin:0 20px 16px; background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius-lg); padding:18px; text-align:center;
}
.rate-block h3{font-family:var(--font-display); font-size:15px; font-weight:600; margin:0 0 12px;}
.star-row{display:flex; justify-content:center; gap:6px; margin-bottom:12px;}
.star-row button{
  background:none; border:none; cursor:pointer; padding:2px;
  font-size:26px; color:var(--line); line-height:1;
}
.star-row button.filled{color:var(--accent);}
.star-row.readonly button{cursor:default;}
.rated-summary{display:flex; justify-content:center; gap:4px; margin-bottom:6px; font-size:20px; color:var(--accent);}

.sla-badge{
  display:inline-flex; align-items:center; gap:4px;
  background:var(--rust-tint); color:var(--rust);
  font-size:10px; font-weight:700; padding:4px 9px; border-radius:999px;
  margin-top:6px;
}
.worker-stats{font-size:11px; color:var(--ink-muted); margin-top:1px; display:flex; align-items:center; gap:4px;}
.worker-stats i{font-size:12px; color:var(--accent);}

.pipeline-track{
  position:relative; height:34px;
  margin:14px 0 4px; padding-top:12px;
  border-top:1px solid var(--line-soft);
}
.pipeline-track-bg{position:absolute; top:17px; left:0; right:0; height:3px; background:var(--line-soft); border-radius:2px;}
.pipeline-track-fill{position:absolute; top:17px; left:0; height:3px; background:var(--primary); border-radius:2px; transition:width .5s cubic-bezier(.4,0,.2,1);}
.pipeline-marker{position:absolute; top:8px; display:flex; flex-direction:column; align-items:center; gap:7px;}
.pipeline-marker-dot{
  width:9px; height:9px; border-radius:50%;
  background:var(--card); border:2.5px solid var(--line-soft);
}
.pipeline-marker.done .pipeline-marker-dot{background:var(--primary); border-color:var(--primary);}
.pipeline-marker.current .pipeline-marker-dot{
  width:11px; height:11px; background:var(--accent); border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-tint);
}
.pipeline-marker-label{font-size:9px; font-weight:600; color:var(--ink-faint); white-space:nowrap;}
.pipeline-marker.done .pipeline-marker-label{color:var(--ink-muted);}
.pipeline-marker.current .pipeline-marker-label{color:var(--accent-ink); font-weight:800;}

.price-band{
  margin:6px 20px 18px;
  background:var(--sage-tint);
  border:1px solid #D6E5D3;
  border-radius:var(--radius-md);
  padding:13px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.price-band.quote{background:var(--accent-tint); border-color:#EFDBAA;}
.price-band .pl{font-size:11.5px; color:var(--ink-muted); font-weight:600;}
.price-band .pv{font-family:var(--font-display); font-size:18px; font-weight:600; color:var(--sage);}
.price-band.quote .pv{color:var(--accent-ink); font-size:13.5px;}

.sticky-cta{
  position:sticky; bottom:0;
  background:linear-gradient(to top, var(--surface) 60%, transparent);
  padding:16px 20px 4px;
}
.btn-primary{
  width:100%;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:var(--radius-sm);
  padding:15px;
  font-family:var(--font-body);
  font-weight:700;
  font-size:14.5px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-primary:active{background:var(--primary-dark);}
.btn-ghost{
  width:100%;
  background:transparent;
  color:var(--primary-dark);
  border:1.5px solid var(--primary);
  border-radius:var(--radius-sm);
  padding:13px;
  font-family:var(--font-body);
  font-weight:700;
  font-size:13.5px;
  cursor:pointer;
}

/* Confirmation */
.confirm-wrap{padding:40px 24px; text-align:center; display:flex; flex-direction:column; align-items:center;}
.confirm-tick{
  width:76px; height:76px; border-radius:50%;
  background:var(--sage-tint); color:var(--sage);
  display:flex; align-items:center; justify-content:center;
  font-size:38px; margin-bottom:18px;
  animation:pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(0.5); opacity:0;} to{transform:scale(1); opacity:1;}}
.confirm-wrap h2{font-family:var(--font-display); font-size:21px; margin:0 0 8px;}

.status-pending{background:var(--accent-tint); color:var(--accent-ink);}
.status-confirmed{background:var(--blue-tint); color:var(--blue);}
.status-assigned{background:var(--primary-tint); color:var(--primary-dark);}
.status-progress{background:var(--rust-tint); color:var(--rust);}
.status-completed{background:var(--sage-tint); color:var(--sage);}
.status-cancelled{background:var(--rust-tint); color:var(--rust);}

/* ======================= MAP HELPERS ======================= */
let activeMap = null;
function destroyActiveMap(){
  if(activeMap){ try{ activeMap.remove(); }catch(e){} activeMap = null; }
}
function addOsmTiles(map){
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
}
function initBookingMap(){
  destroyActiveMap();
  const el = document.getElementById('booking-map');
  if(!el || typeof L === 'undefined') return;
  const c = cityById(state.draft.city);
  const lat = state.draft.lat ?? c.lat;
  const lng = state.draft.lng ?? c.lng;
  activeMap = L.map('booking-map', {zoomControl:false, attributionControl:false}).setView([lat,lng], 13);
  addOsmTiles(activeMap);
  setTimeout(()=>{ if(activeMap) activeMap.invalidateSize(); }, 120);
  const marker = L.marker([lat,lng], {draggable:true}).addTo(activeMap);
  marker.on('dragend', ()=>{
    const pos = marker.getLatLng();
    state.draft.lat = pos.lat; state.draft.lng = pos.lng;
  });
  activeMap.on('click', (e)=>{
    marker.setLatLng(e.latlng);
    state.draft.lat = e.latlng.lat; state.draft.lng = e.latlng.lng;
  });
}
function initViewMap(containerId, lat, lng){
  destroyActiveMap();
  const el = document.getElementById(containerId);
  if(!el || typeof L === 'undefined') return;
  activeMap = L.map(containerId, {zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false, tap:false}).setView([lat,lng], 15);
  addOsmTiles(activeMap);
  setTimeout(()=>{ if(activeMap) activeMap.invalidateSize(); }, 120);
  L.marker([lat,lng]).addTo(activeMap);
}
function opsPinColor(status){
  if(status==='pending') return '#D9A441';
  if(status==='confirmed' || status==='assigned') return '#0B7D8C';
  if(status==='progress') return '#B85C38';
  return '#8B9A93';
}
function initOpsMap(){
  destroyActiveMap();
  const el = document.getElementById('ops-map');
  if(!el || typeof L === 'undefined') return;
  const active = orders.filter(o=>o.status!=='completed' && o.status!=='cancelled');
  if(active.length===0){
    activeMap = L.map('ops-map', {zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false, tap:false}).setView([28,50], 5);
    addOsmTiles(activeMap);
    setTimeout(()=>{ if(activeMap) activeMap.invalidateSize(); }, 120);
    return;
  }
  activeMap = L.map('ops-map', {zoomControl:false, attributionControl:false, dragging:true, scrollWheelZoom:false, tap:false});
  addOsmTiles(activeMap);
  const markers = [];
  active.forEach(o=>{
    const m = L.circleMarker([o.lat, o.lng], {
      radius:9, fillColor:opsPinColor(o.status), color:'#fff', weight:2, fillOpacity:0.95
    }).addTo(activeMap);
    m.on('click', ()=>{ openAdminOrder(o.id); });
    markers.push(m);
  });
  const group = L.featureGroup(markers);
  activeMap.fitBounds(group.getBounds(), {padding:[28,28], maxZoom:8});
  setTimeout(()=>{ if(activeMap) activeMap.invalidateSize(); }, 120);
}

/* ======================= HELPERS ======================= */
function cityById(id){ return CITIES.find(c=>c.id===id); }
function serviceById(id){ return SERVICES.find(s=>s.id===id); }
function workerById(id){ return WORKERS.find(w=>w.id===id); }
function initials(name){ return name.split(' ').map(p=>p[0]).slice(0,2).join(''); }
function todayISO(){ return new Date().toISOString().split('T')[0]; }
function fmtDateLabel(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function avatarImg(photoUrl, name, sizeClass){
  const cls = sizeClass ? `avatar ${sizeClass}` : 'avatar';
  return `<div class="${cls}"><img src="${photoUrl}" alt="${name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.textContent='${initials(name)}';"></div>`;
}
function serviceAmount(service, cityId){
  if(!service.fixed) return null;
  const c = cityById(cityId);
  return c.currency==='AED' ? service.priceAED : service.priceIQD;
}
function priceFor(service, cityId){
  const amt = serviceAmount(service, cityId);
  if(amt===null) return null;
  const c = cityById(cityId);
  return c.currency==='AED' ? `AED ${amt}` : `IQD ${amt.toLocaleString()}`;
}
function placementAmount(typeId, cityId, workers, durationId){
  const type = PLACEMENTS.find(p=>p.id===typeId);
  const c = cityById(cityId);
  const dur = DURATIONS.find(d=>d.id===durationId);
  const perWorker = c.currency==='AED' ? type.feeAED : type.feeIQD;
  return Math.round(perWorker * dur.multiplier * workers);
}
function placementPrice(typeId, cityId, workers, durationId){
  const c = cityById(cityId);
  const amt = placementAmount(typeId, cityId, workers, durationId);
  return `${c.currency} ${amt.toLocaleString()}`;
}
function isSlaBreach(o){
  return o.status==='pending' && (Date.now() - o.createdAt) > SLA_MINUTES*60000;
}
function burstConfetti(){
  const layer = document.getElementById('confettiLayer');
  if(!layer) return;
  const colors = ['#0B7D8C','#D9A441','#B85C38','#4C7A52','#3E7CB1'];
  const count = 40;
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const color = colors[i % colors.length];
    const isCircle = i % 2 === 0;
    piece.style.left = (Math.random()*100) + '%';
    piece.style.background = color;
    piece.style.borderRadius = isCircle ? '50%' : '2px';
    piece.style.width = (5 + Math.random()*5) + 'px';
    piece.style.height = piece.style.width;
    piece.style.animationDuration = (900 + Math.random()*700) + 'ms';
    piece.style.animationDelay = (Math.random()*180) + 'ms';
    layer.appendChild(piece);
  }
  setTimeout(()=>{ layer.innerHTML = ''; }, 2000);
}
function showToast(msg, icon){
  const el = document.getElementById('toast');
  el.innerHTML = `<i class="ti ${icon||'ti-check'}"></i> ${msg}`;
  el.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>el.classList.remove('show'), 2200);
}

  vp.innerHTML = state.role==='customer' ? renderCustomer() : state.role==='worker' ? renderWorker() : renderAdmin();
  const screenEl = vp.querySelector('.screen');
  if(screenEl && screenChanged){
    screenEl.classList.add(state.navDirection==='back' ? 'pop' : state.navDirection==='forward' ? 'push' : 'fade');
  }
  lastRenderedScreen = state.screen;
  lastRenderedRole = state.role;
  state.navDirection = 'none';
  requestAnimationFrame(initMapsForScreen);
}
function initMapsForScreen(){
  if(state.role==='customer' && state.screen==='service-detail'){

    const o = orders.find(x=>x.id===state.activeOrder);

  return Object.keys(errs).length === 0;

  const d = state.placementDraft;
  inquiries.unshift({

    customer:'Aaliyah R.',

    workers: d.workers,
    duration: d.duration,
    liveType: d.liveType,
    startDate: fmtDateLabel(d.startDate),

  state.placementDraft.notes = '';
  state.placementDraft.startDate = '';
  state.placementErrors = {};
  showToast('Request sent — our team will follow up', 'ti-send');
  render();
}

function computeFinancials(){
  const fin = {
    bookingsCollectedAED:0, bookingsCollectedIQD:0,
    bookingsPendingAED:0, bookingsPendingIQD:0,
    byService:{},
    placementsRealizedAED:0, placementsRealizedIQD:0,
    placementsPipelineAED:0, placementsPipelineIQD:0,
  };
  orders.forEach(o=>{
    const s = serviceById(o.service);
    if(!s.fixed || o.status==='cancelled') return;
    const c = cityById(o.city);
    const amt = serviceAmount(s, o.city);
    if(!fin.byService[s.id]) fin.byService[s.id] = {name:s.name, count:0, aed:0, iqd:0};
    if(o.status==='completed'){
      if(c.currency==='AED') fin.bookingsCollectedAED += amt; else fin.bookingsCollectedIQD += amt;
      fin.byService[s.id].count++;
      if(c.currency==='AED') fin.byService[s.id].aed += amt; else fin.byService[s.id].iqd += amt;
    } else {
      if(c.currency==='AED') fin.bookingsPendingAED += amt; else fin.bookingsPendingIQD += amt;
    }
  });
  inquiries.forEach(q=>{
    const c = cityById(q.city);
    const amt = placementAmount(q.type, q.city, q.workers, q.duration);
    if(q.status==='placed'){
      if(c.currency==='AED') fin.placementsRealizedAED += amt; else fin.placementsRealizedIQD += amt;
    } else {
      if(c.currency==='AED') fin.placementsPipelineAED += amt; else fin.placementsPipelineIQD += amt;
    }
  });
  return fin;
}

function exportFinancialsCsv(){
  const f = computeFinancials();
  const rows = [
    ['Metric','Currency','Amount'],
    ['Bookings collected','AED', f.bookingsCollectedAED],
    ['Bookings collected','IQD', f.bookingsCollectedIQD],
    ['Bookings pending','AED', f.bookingsPendingAED],
    ['Bookings pending','IQD', f.bookingsPendingIQD],
    ['Placements realized','AED', f.placementsRealizedAED],
    ['Placements realized','IQD', f.placementsRealizedIQD],
    ['Placements pipeline','AED', f.placementsPipelineAED],
    ['Placements pipeline','IQD', f.placementsPipelineIQD],
    [],
    ['Service','Completed count','AED revenue','IQD revenue'],
    ...Object.values(f.byService).map(r=>[r.name, r.count, r.aed, r.iqd]),
  ];
  const csv = rows.map(r=>r.map(cell=>`"${String(cell??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tadbeer-financials.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV downloaded', 'ti-download');
}

        </div>`;
      }).join('')}
    </div>
    <div class="section-label">Needs attention</div>
    <div class="card-list">
      ${orders.filter(o=>o.status==='pending').map(o=>{
        const s = serviceById(o.service);
        const breach = isSlaBreach(o);
        return `<div class="order-card" onclick="openAdminOrder(${o.id})">
          <div class="order-top"><b>#${o.id} · ${s.name}</b><span class="status-pill status-pending">Needs assignment</span></div>
          <div class="order-meta"><i class="ti ti-map-pin"></i> ${cityById(o.city).name}</div>
          ${breach ? `<div class="sla-badge"><i class="ti ti-alert-triangle"></i> ${t('needsAttention')}</div>` : ''}
        </div>`;
      }).join('') || `<div class="empty-state"><i class="ti ti-check"></i><b>All caught up</b><span>No orders waiting on dispatch.</span></div>`}
    </div>
  </div>`;
}

function workerStats(workerId){
  const done = orders.filter(o=>o.workerId===workerId && o.status==='completed');
  const rated = done.filter(o=>o.rating);
  const avg = rated.length ? (rated.reduce((sum,o)=>sum+o.rating,0)/rated.length).toFixed(1) : null;
  return {count:done.length, avg};
}
function screenAdminWorkers(){
  return `<div class="screen">
    <div class="topbar"><h1>Workers</h1></div>
    <div class="card-list">
      ${WORKERS.map(w=>{
        const st = workerStats(w.id);
        return `
        <div class="order-card" style="display:flex; align-items:center; gap:12px; cursor:default;">
          ${avatarImg(w.photo, w.name)}
          <div style="flex:1;">
            <b style="display:block; font-size:13.5px; font-weight:700;">${w.name}</b>
            <span style="font-size:11.5px; color:var(--ink-muted); text-transform:capitalize;">${w.skill}</span>
            <div class="worker-stats">
              <i class="ti ti-check"></i> ${st.count} ${st.count===1?'job completed':'jobs completed'}
              ${st.avg ? `<span style="margin-left:6px;"><i class="ti ti-star-filled"></i> ${st.avg}</span>` : `<span style="margin-left:6px; color:var(--ink-faint);">${t('noRatingsYet')}</span>`}
            </div>
          </div>
          <div class="chip ${w.available?'active':''}" style="padding:7px 12px; font-size:11px;" onclick="toggleWorker('${w.id}')">
            ${w.available?'Available':'Off duty'}
          </div>
        </div>`;}).join('')}
    </div>
  </div>`;
}
function toggleWorker(id){
  const w = workerById(id);
  w.available = !w.available;
  render();
}

/* ======================= CLOCK ======================= */
function tickClock(){
  const el = document.getElementById('clock');
  if(el) el.textContent = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
tickClock();
setInterval(tickClock, 30000);
setInterval(()=>{
  if(state.role==='admin' && (state.adminTab==='queue' || state.adminTab==='dashboard') && state.screen!=='admin-order'){
    render();
  }
}, 60000);

/* ======================= INIT ======================= */
render();
setTimeout(()=>{
  const splash = document.getElementById('splash');
  if(splash) splash.classList.add('hide');
}, 850);
</script>
</body>
</html>
